<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabs管理工具</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">tabs管理工具</div>
      <div class="topbar-count">共 <span id="totalCount">0</span> 个标签页</div>
    </div>
    <div class="topbar-right">
      <button id="settingsBtn" class="icon-btn" type="button" title="自定义分类" aria-label="自定义分类">⚙</button>
      <label class="select-all-label">
        <input type="checkbox" id="selectAll">
        <span>全选</span>
      </label>
    </div>
  </header>

  <div id="settingsPop" class="settings-pop hidden">
    <div class="settings-title">自定义分类</div>
    <div class="settings-sub">把冷门域名手动归入分类,优先于内置规则;支持子域名匹配。</div>
    <div id="customRuleList" class="custom-rule-list"></div>
    <div class="custom-rule-form">
      <input id="ruleDomain" class="rule-domain" type="text" placeholder="域名,如 mycorp.com" autocomplete="off" spellcheck="false">
      <select id="ruleCategory" class="rule-category" aria-label="分类"></select>
      <button id="ruleAdd" class="rule-add" type="button">添加</button>
    </div>
  </div>

  <div class="search-bar">
    <div class="view-switch" role="tablist" aria-label="分组方式">
      <button type="button" class="view-switch-btn active" id="viewDomain" role="tab" aria-selected="true">按域名</button>
      <button type="button" class="view-switch-btn" id="viewType" role="tab" aria-selected="false">按类型</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="搜索标题、URL、域名"
        autocomplete="off"
        spellcheck="false"
      >
      <button id="searchClear" class="search-clear hidden" type="button" title="清空搜索" aria-label="清空搜索">×</button>
    </div>
  </div>

  <main id="groupList" class="group-list"></main>

  <section id="recentSection" class="recent-section collapsed hidden">
    <div class="recent-header" id="recentHeader" role="button" tabindex="0" title="展开/折叠">
      <span class="recent-toggle" id="recentToggle">▸</span>
      <span class="recent-title">最近关闭</span>
    </div>
    <div class="recent-list" id="recentList"></div>
  </section>

  <div id="emptyState" class="empty-state hidden">
    <div class="empty-icon">✓</div>
    <div class="empty-text">没有可管理的标签页</div>
    <div class="empty-hint">新打开的网页会按域名自动分组显示在这里</div>
  </div>

  <footer id="actionBar" class="action-bar hidden">
    <button id="closeSelected" class="btn btn-danger" type="button">
      关闭选中(<span class="btn-count" id="closeCount">0</span>)
    </button>
    <button id="discardSelected" class="btn" type="button">
      挂起选中(<span class="btn-count" id="discardCount">0</span>)
    </button>
  </footer>

  <script src="../shared/domain.js"></script>
  <script src="../shared/categories.js"></script>
  <script src="panel.js"></script>
</body>
</html>
